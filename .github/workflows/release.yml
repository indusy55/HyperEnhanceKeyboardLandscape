name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/hyperenhance.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: hyperenhance
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret KEYSTORE_PASSWORD"
            exit 1
          fi
          ./gradlew :app:assembleRelease

      - name: Collect and verify APK
        run: |
          APK="$(find app/build/outputs/apk/release -name 'app-release*.apk' ! -name '*unsigned*' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::Signed release APK not found"
            exit 1
          fi
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/HyperEnhanceKeyboardLandscape-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
